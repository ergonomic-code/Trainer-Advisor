- hosts: all

  vars:
    domain_name: ta.azhidkov.pro

  become: true

  tasks:

    # Install Docker
    - name: install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
        state: latest
        update_cache: yes

    - name: GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: repository docker
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: install docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: latest
        update_cache: yes

    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '755'

    # Install nginx
    - name: Install nginx
      apt:
        name: nginx
        state: latest
        update_cache: yes

    - name: Configure nginx
      tags: configure-nginx
      template:
        src: files/nginx.conf.j2
        dest: /etc/nginx/conf.d/backend.conf
      notify: Restart Nginx

    # Сертификат и его автоматическое продление обслуживает Certbot.
    - name: Install Certbot
      tags: cert
      apt:
        name: certbot
        state: present

    - name: Issue certificate
      tags: cert
      command:
        argv:
          - certbot
          - certonly
          - --webroot
          - -w
          - /var/www/html
          - -d
          - "{{ domain_name }}"
          - --non-interactive
          - --keep-until-expiring

    - name: Enable certificate renewal
      tags: cert
      systemd:
        name: certbot.timer
        enabled: true
        state: started

    - name: Reload Nginx after certificate renewal
      tags: cert
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        mode: '0755'
        content: |
          #!/bin/sh
          nginx -t && systemctl reload nginx

    # Open ports

    - name: Allow HTTP
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 80
        ctstate: NEW
        jump: ACCEPT
        comment: Allow HTTP

    - name: Allow HTTPS
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 443
        ctstate: NEW
        jump: ACCEPT
        comment: Allow HTTPS

  # Setup handlers

  handlers:
    - name: Restart Nginx
      tags: configure-nginx
      service:
        name: nginx
        state: reloaded
      become: true
